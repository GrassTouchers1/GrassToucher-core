[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grasstoucher-core"
version = "0.4.0"
description = "Lõi thuật toán tìm đường thích ứng ngập lụt đô thị và mô hình AI dự báo mực nước (100% Mã nguồn mở)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GrassTouchers Team" }
]
keywords = ["gis", "routing", "astar", "flood", "machine-learning", "openstreetmap", "smart-city"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "osmnx>=2.0,<3",
    "networkx>=2.5",
    "scikit-learn>=1.5,<2",
    "geopandas>=1.0",
    "shapely>=2.0",
    "numpy>=1.24",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
